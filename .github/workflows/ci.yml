name: CI

# A branch with an open pull request would run twice on every push if this
# listened to '**'. Integration goes through a pull request anyway, so nothing
# heading for main escapes the pipeline.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The checks run as parallel jobs; "Tests and quality" gathers them under the name the
# main branch ruleset requires.
jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # 8.4 is the FrankenPHP version, not the ^8.2 of composer.json.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, gd, intl, zip, pcntl
          coverage: none

      - name: Prepare the environment file
        run: cp .env.example .env

      - name: Resolve the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate the application key
        run: php artisan key:generate

      # Rector and PHPStan invalidate their own entries on a changed file or setting;
      # the cache only spares the cold run. A new key per commit keeps it current.
      - name: Cache the Rector and PHPStan results
        uses: actions/cache@v6
        with:
          path: |
            /tmp/rector_cached_files
            /tmp/phpstan
          key: analysis-${{ runner.os }}-${{ hashFiles('composer.lock', 'rector.php', 'phpstan.neon') }}-${{ github.sha }}
          restore-keys: analysis-${{ runner.os }}-${{ hashFiles('composer.lock', 'rector.php', 'phpstan.neon') }}-

      # Same order as the pre-commit hook: Rector transforms, Pint formats,
      # PHPStan reads the result. Here none of them writes.
      - name: Check pending Rector refactorings
        run: make refactor-check

      - name: Check the code style
        run: make lint-check

      - name: Run the static analysis
        run: make static

      - name: Check the documentation coverage
        run: make docs-coverage

      - name: Check that mixed stays within its declared boundaries
        run: make mixed-check

      - name: Check that test temporary paths never rely on uniqid
        run: make temp-paths-check

      # Catches the day someone swaps pint --test for pint, or drops --dry-run.
      - name: Check that no step rewrote the working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "A quality step modified tracked files; every one must run read-only." >&2
            exit 1
          fi

  tests:
    name: PHP tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: wowplanet_test
          POSTGRES_USER: wowplanet
          POSTGRES_PASSWORD: wowplanet
          # Alpine carries no system locale, hence the ICU provider.
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --locale-provider=icu --icu-locale=fr-FR
        ports:
          # compose.yml ports, so .env.example needs no CI override.
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wowplanet -d wowplanet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, gd, intl, zip, pcntl
          coverage: pcov

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Prepare the environment file
        run: cp .env.example .env

      - name: Resolve the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate the application key
        run: php artisan key:generate

      - name: Install JavaScript dependencies
        run: npm ci

      # The Inertia feature tests render app.blade.php, which reads the manifest: a
      # missing entry fails them, which is worth the few seconds of a build here.
      - name: Build the front-end assets
        run: npm run build

      - name: Report the installed versions
        run: |
          php --version
          php -m
          node --version

      # Plain SELECTs: the runner's psql predates the server, and its \l reads
      # daticulocale, renamed datlocale in PG 17.
      - name: Check the test database collation
        env:
          PGPASSWORD: wowplanet
        run: |
          psql -h 127.0.0.1 -p 55432 -U wowplanet -d wowplanet_test \
            -c "SELECT datname, datlocprovider, datcollate, datctype, datlocale
                FROM pg_database WHERE datname = 'wowplanet_test'"
          provider=$(psql -h 127.0.0.1 -p 55432 -U wowplanet -d wowplanet_test -tAc \
            "SELECT datlocprovider FROM pg_database WHERE datname = 'wowplanet_test'")
          locale=$(psql -h 127.0.0.1 -p 55432 -U wowplanet -d wowplanet_test -tAc \
            "SELECT datlocale FROM pg_database WHERE datname = 'wowplanet_test'")
          if [ "$provider" != "i" ] || [ "$locale" != "fr-FR" ]; then
            echo "Expected the ICU provider on fr-FR, got '$provider' on '$locale'." >&2
            exit 1
          fi

      # phpunit.xml pins DB_DATABASE for the suite; this step runs outside it.
      - name: Run the database migrations
        env:
          DB_DATABASE: wowplanet_test
        run: php artisan migrate --force

      # One process per core, each on its own database and Redis key prefix.
      - name: Run the Pest suite with coverage and the CRAP check
        run: make coverage-php-ci

      - name: Check that no step rewrote the working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "A step modified tracked files; every one must run read-only." >&2
            exit 1
          fi

  front:
    name: Front end
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check that the front end only paints with design tokens
        run: make tokens-check

      - name: Build the front-end assets
        run: npm run build

      # npm run build chains vite build and vite build --ssr; the SSR sidecar
      # runs in production, so a bundle that only breaks there must not pass.
      - name: Check the produced bundles
        run: |
          test -f public/build/manifest.json
          test -f bootstrap/ssr/ssr.js

      - name: Run the Vitest suite with coverage
        run: make coverage-js

      - name: Check that no step rewrote the working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "A step modified tracked files; every one must run read-only." >&2
            exit 1
          fi

  quality:
    name: Tests and quality
    runs-on: ubuntu-latest
    needs: [static, tests, front]
    if: always()

    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Static analysis, PHP tests, front end: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  # Mutation only runs on the perimeter classes the change touches, each one against its
  # dedicated tests and with its mutants in parallel (scripts/mutate.sh).
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: wowplanet_test
          POSTGRES_USER: wowplanet
          POSTGRES_PASSWORD: wowplanet
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --locale-provider=icu --icu-locale=fr-FR
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wowplanet -d wowplanet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # The whole history: the selection diffs the branch against its merge base.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, gd, intl, zip, pcntl
          coverage: pcov

      - name: Prepare the environment file
        run: cp .env.example .env

      - name: Resolve the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate the application key
        run: php artisan key:generate

      - name: Run the database migrations
        env:
          DB_DATABASE: wowplanet_test
        run: php artisan migrate --force

      # A pull request is compared with its target branch, a push to main with the
      # commit it follows.
      - name: Mutate the perimeter classes the change touches
        env:
          PEST: vendor/bin/pest
          MUTATION_MIN: 80
          MUTATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/mutate.sh --base="$MUTATION_BASE"
