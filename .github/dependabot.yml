version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    assignees:
      - thedevopser
    labels:
      - dependencies
    groups:
      composer-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    assignees:
      - thedevopser
    labels:
      - dependencies
    # Packages that declare each other as peers only install together: a family moves
    # as one pull request, major versions included, before the generic group below.
    groups:
      vite:
        patterns:
          - vite
          - "@vitejs/*"
          - "@tailwindcss/vite"
          - laravel-vite-plugin
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
          - vitest-axe
      pinia:
        patterns:
          - pinia
          - "@pinia/*"
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    assignees:
      - thedevopser
    labels:
      - dependencies
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
